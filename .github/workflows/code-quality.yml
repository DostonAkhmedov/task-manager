name: Code Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Code Quality Check
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Check for security issues with gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
      
      - name: Upload gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: gosec-results.sarif
          wait-for-processing: true

  # Dependency Check
  dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Run nancy - Golang dependency vulnerability scanner
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Check for vulnerable dependencies
        run: |
          go list -json -m all | nancy sleuth -o text || true

  # Test Coverage Quality Gate
  coverage:
    name: Coverage Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: task_manager
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"127.0.0.1" -u"root" -p"root123" --silent; do
            echo 'Waiting for MySQL...'
            sleep 1
          done
      
      - name: Initialize MySQL Database
        run: |
          mysql -h 127.0.0.1 -u root -proot123 task_manager < migrations/schema.sql
      
      - name: Run tests with coverage
        run: go test -v -short -coverprofile=coverage.out ./...
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root123
          DB_NAME: task_manager
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      
      - name: Check coverage threshold
        continue-on-error: true
        run: |
          if [ ! -f coverage.out ]; then
            echo "Coverage file not found, skipping coverage check"
            exit 0
          fi
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Code coverage: $coverage%"
          if (( $(echo "$coverage < 30" | bc -l) )); then
            echo "Warning: Coverage is below 30% threshold"
            exit 1
          fi
      
      - name: Generate coverage report
        if: always() && hashFiles('coverage.out') != ''
        run: go tool cover -html=coverage.out -o coverage.html
      
      - name: Upload coverage artifacts
        if: always() && hashFiles('coverage.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
